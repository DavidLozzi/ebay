[project]
name = "ebay-agent"
version = "0.1.0"
description = "Inventory and listing automation tool powered by MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "openai>=1.13.3",
]

[project.scripts]
ebay-agent = "app:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "gpt*", "mcp*", "utils*"]

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"
